services:
  - type: web
    name: lecturemind-ai
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash render-build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --threads 4
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: "20"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: WHISPER_MODEL
        value: whisper-large-v3
      - key: TRANSCRIPT_MAX_CHARS
        value: "40000"
      - key: CORS_ORIGINS
        value: "*"
      - key: SESSION_TTL_SECONDS
        value: "21600"